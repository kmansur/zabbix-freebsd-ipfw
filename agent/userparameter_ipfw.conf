# Run only a root-owned, read-only script. Adjust sudo path/permissions for your FreeBSD host.
# Example sudoers entry (adapt to actual Zabbix account and verify with visudo):
# zabbix ALL=(root) NOPASSWD: /usr/local/scripts/zabbix/ipfw_collect.sh
UserParameter=ipfw.raw,/usr/local/bin/sudo -n /usr/local/scripts/zabbix/ipfw_collect.sh

# Read-only discovery and counts of numerical IPFW tables.
# Restrict sudoers to these exact root-owned scripts. No blanket NOPASSWD: ALL.
UserParameter=ipfw.tables.discovery,/usr/local/bin/sudo -n /usr/local/scripts/zabbix/ipfw_table_discovery.sh
UserParameter=ipfw.table.entries[*],/usr/local/bin/sudo -n /usr/local/scripts/zabbix/ipfw_table_entries.sh "$1"
UserParameter=ipfw.table.set.entries[*],/usr/local/bin/sudo -n /usr/local/scripts/zabbix/ipfw_table_entries.sh "$1" "$2"

# Optional aggregate duplicate/unique-host inventory. Requires Python 3.
# Authorize only this root-owned script with sudoers, not arbitrary Python code.
UserParameter=ipfw.inventory.raw,/usr/local/bin/sudo -n /usr/local/scripts/zabbix/ipfw_inventory_collect.py

# Consolidated table metadata for dependent discovery and counters.
UserParameter=ipfw.tables.raw,/usr/local/bin/sudo -n /usr/local/scripts/zabbix/ipfw_tables_collect.py
