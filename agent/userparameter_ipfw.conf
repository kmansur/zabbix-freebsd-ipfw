# Run only a root-owned, read-only script. Adjust sudo path/permissions for your FreeBSD host.
# Example sudoers entry (adapt to actual Zabbix account and verify with visudo):
# zabbix ALL=(root) NOPASSWD: /usr/local/libexec/zabbix/ipfw_collect.sh
UserParameter=ipfw.raw,/usr/local/bin/sudo -n /usr/local/libexec/zabbix/ipfw_collect.sh
