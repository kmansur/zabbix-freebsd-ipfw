      discovery_rules:
        - uuid: 8fd0794f3fbb4f8f978731ec37e3d0e1
          name: 'IPFW: Discover address tables'
          type: DEPENDENT
          key: ipfw.tables.discovery
          delay: '0'
          master_item:
            key: ipfw.tables.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data'
              error_handler: DISCARD_VALUE
          filter:
            evaltype: AND
            conditions:
              - macro: '{#TABLE_TYPE}'
                value: '^addr$'
                formulaid: A
          item_prototypes:
            - uuid: 53164ce0308f4a39b40ed7a68ebd9a74
              name: 'IPFW: Table {#TABLE_ID} entries (set {#TABLE_SET})'
              type: DEPENDENT
              key: 'ipfw.table.set.entries[{#TABLE_ID},{#TABLE_SET}]'
              delay: '0'
              master_item:
                key: ipfw.tables.raw
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.entries['{#TABLE_SET}:{#TABLE_ID}']"
                  error_handler: DISCARD_VALUE
              history: 30d
              trends: 365d
              tags:
                - tag: component
                  value: tables
                - tag: table
                  value: '{#TABLE_ID}'
          graph_prototypes:
            - uuid: 99fc22a8b0cd4a61bf5ce6c3d66e07e2
              name: 'IPFW: Table {#TABLE_ID} entries (set {#TABLE_SET})'
              graph_items:
