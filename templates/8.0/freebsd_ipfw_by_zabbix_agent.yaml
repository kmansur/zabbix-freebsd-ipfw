      discovery_rules:
        - uuid: 8fd0794f3fbb4f8f978731ec37e3d0e1
          name: 'IPFW: Discover address tables'
          type: DEPENDENT
          key: ipfw.tables.discovery
          delay: '0'
          master_item:
            key: ipfw.tables.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data'
              error_handler: DISCARD_VALUE
          filter:
            evaltype: AND
            conditions:
              - macro: '{#TABLE_TYPE}'
                value: '^addr$'
                formulaid: A
              - macro: '{#TABLE_ID}'
                value: '{$IPFW.TABLE.NAME.MATCHES}'
                formulaid: B
              - macro: '{#TABLE_ID}'
                value: '{$IPFW.TABLE.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
              - macro: '{#TABLE_SET}'
                value: '{$IPFW.TABLE.SET.MATCHES}'
                formulaid: D
          item_prototypes:
            - uuid: 53164ce0308f4a39b40ed7a68ebd9a74
              name: 'IPFW: Table {#TABLE_ID} entries (set {#TABLE_SET})'
              type: DEPENDENT
              key: 'ipfw.table.set.entries[{#TABLE_ID},{#TABLE_SET}]'
              delay: '0'
              master_item:
                key: ipfw.tables.raw
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.entries['{#TABLE_SET}:{#TABLE_ID}']"
                  error_handler: DISCARD_VALUE
              history: 30d
              trends: 365d
              tags:
                - tag: component
                  value: tables
                - tag: table
                  value: '{#TABLE_ID}'
          graph_prototypes:
            - uuid: 99fc22a8b0cd4a61bf5ce6c3d66e07e2
              name: 'IPFW: Table {#TABLE_ID} entries (set {#TABLE_SET})'
              graph_items:
                - color: 34D399
                  item:
                    host: 'FreeBSD IPFW by Zabbix Agent'
                    key: 'ipfw.table.set.entries[{#TABLE_ID},{#TABLE_SET}]'
      macros:
      - macro: '{$IPFW.RULES.INTERVAL}'
        value: 1m
        description: Rule collector polling interval. Keep the rules no-data window greater than this value.
      - macro: '{$IPFW.INVENTORY.INTERVAL}'
        value: 5m
        description: Aggregate inventory polling interval.
      - macro: '{$IPFW.TABLES.INTERVAL}'
        value: 5m
        description: Table metadata polling interval; also drives dependent discovery and entry counts.
      - macro: '{$IPFW.RULES.NODATA}'
        value: 5m
        description: Rule collector no-data window. Must exceed the polling interval.
      - macro: '{$IPFW.INVENTORY.NODATA}'
        value: 15m
        description: Inventory no-data window. Must exceed the polling interval.
      - macro: '{$IPFW.TABLES.NODATA}'
        value: 15m
        description: Table metadata no-data window. Must exceed the polling interval.
      - macro: '{$IPFW.TABLE.NAME.MATCHES}'
        value: .*
        description: Include table names/IDs matching this regular expression.
      - macro: '{$IPFW.TABLE.NAME.NOT_MATCHES}'
        value: ^$
        description: Exclude table names/IDs matching this regular expression.
      - macro: '{$IPFW.TABLE.SET.MATCHES}'
        value: .*
        description: Include table sets matching this regular expression. Does not change IPFW configuration.
